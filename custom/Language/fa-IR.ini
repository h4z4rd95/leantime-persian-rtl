text.mattermost_instructions=" این ادغام، اعلان‌های به‌روزرسانی را در کانال مورد انتخاب شما ارسال می‌کند.<br/>دستورالعمل‌ها را <a href='https://docs.mattermost.com/developer/webhooks-incoming.html#simple-incoming-webhook' target='_blank'>اینجا دنبال کنید تا یک آدرس Incoming Webhook</a> از Mattermost دریافت کنید. سپس لینک را در فرم سمت چپ قرار دهید و روی ذخیره کلیک کنید."
text.slack_instructions="این ادغام، اعلان‌های به‌روزرسانی را در کانال مورد انتخاب شما ارسال می‌کند.<br/>دستورالعمل‌ها را <a href='https://get.slack.help/hc/en-us/articles/115005265063-Incoming-WebHooks-for-Slack' target='_blank'>اینجا دنبال کنید تا یک آدرس Incoming Webhook</a> از Slack دریافت کنید. سپس لینک را در فرم سمت چپ قرار دهید و روی ذخیره کلیک کنید."
text.choose_access_for_users="کاربرانی را که می‌خواهید اضافه/حذف کنید، تیک بزنید یا تیکشان را بردارید. می‌توانید درباره نقش‌ها بیشتر بدانید: <a href='https://docs.leantime.io/#/using-leantime/user-management?id=roles' target='_blank'>https://docs.leantime.io</a>"
text.expected_to_finish_by="انتظار می‌رود تا این تاریخ تکمیل شود"
text.zulip_instructions="این ادغام، اعلان‌های به‌روزرسانی را در استریم و موضوع مورد انتخاب شما ارسال می‌کند.<br/>دستورالعمل‌ها را <a href='https://zulipchat.com/help/add-a-bot-or-integration' target='_blank'>اینجا دنبال کنید تا یک ربات جدید ایجاد کنید</a>. سپس اطلاعات را در فرم سمت چپ قرار دهید و روی ذخیره کلیک کنید."
text.telegram_instructions="این ادغام، اعلان‌های به‌روزرسانی را در یک گفتگوی Telegram ارسال می‌کند.<br/>با <a href='https://core.telegram.org/bots#how-do-i-create-a-bot' target='_blank'>@BotFather</a> یک ربات ایجاد کنید و توکن را در سمت چپ قرار دهید. یک‌بار به ربات خود پیام بدهید و روی ذخیره کلیک کنید تا گفتگو خودکار تشخیص داده شود — یا، برای یک گروه با Topics فعال، شناسه گفتگو و شناسه Topic گروه را مستقیماً وارد کنید."
text.discord_instructions="این ادغام، اعلان‌های به‌روزرسانی را در کانال مورد انتخاب شما ارسال می‌کند.<br/>دستورالعمل‌ها را <a href='https://support.discord.com/hc/en-us/articles/228383668-Intro-to-Webhooks' target='_blank'>اینجا دنبال کنید تا webhook جدید ایجاد کنید</a>، سپس لینک‌ها را در فیلدهای سمت چپ قرار دهید و روی ذخیره کلیک کنید."
