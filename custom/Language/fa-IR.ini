text.cp.helper_content="<em>Competitive Positioning Canvas</em> به شما کمک می‌کند جایگاه‌گیری رقابتی خود را از نگاه مشتری (و نه رقیب) ارزیابی کنید. این بوم روی عوامل تصمیم‌گیری منطقی و احساسی تمرکز دارد و آن‌ها را به دو دسته ارزش‌آفرین و کاهنده هزینه تقسیم می‌کند.<br/>پیشنهاد می‌کنیم پس از طراحی مدل کسب‌وکار تفصیلی خود، از این بوم استفاده کنید."
