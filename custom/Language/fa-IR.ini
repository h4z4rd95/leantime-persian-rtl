text.obm.helper_content="<em>Original Business Model Canvas</em> توسّط الکس استر والدر (Alex Osterwalder) و ایو پینیور (Yves Pigneur) توسعه یافته است. این بوم به شما کمک می‌کند سازمان فعلی، رقبا و صنعت خود را مستند کنید.<br/><em>«یک مدل کسب‌وکار، منطقِ اینکه یک سازمان چگونه ارزش می‌آفریند، تحویل می‌دهد و به‌دست می‌آورد را توضیح می‌دهد»</em> - <strong>Alex Osterwalder</strong>."
