text.lbm.helper_content="<em>مدل کسب‌وکار سبک</em> به شما کمک می‌کند سازمان فعلی، رقبا و صنعت خود را مستند کنید. این تابلو از شناسایی تمرکز استراتژیک یک شرکت پشتیبانی می‌کند و پایه‌ای برای طراحی مدل کسب‌وکار تفصیلی نوآورانه و رقابتی فراهم می‌کند.<br/>توصیه می‌کنیم هر بار که به جزئیات مدل کسب‌وکار تفصیلی یا مدل کسب‌وکار اصلی استروالتر نیاز ندارید، از نوع سبک بوم مدل کسب‌وکار استفاده کنید."
