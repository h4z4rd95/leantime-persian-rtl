text.visit_site="بازدید از سایت"
text.installed_plugins="افزونه‌های نصب شده"
text.rating="امتیاز: "
text.first_login_intro="هیجان‌زده‌ایم که شما را راهنمایی کنیم. بیایید اولین پروژه خود را شروع کنیم!"
text.helpful_resources="یادگیری هر نرم‌افزار جدیدی می‌تواند دلهره‌آور باشد، ما تلاش می‌کنیم Leantime را تا جای ممکن ساده و سرراست کنیم.<br />اگر هر زمان احساس گیر کردن کردید یا می‌خواستید ایده‌ها را تبادل کنید، می‌توانید از منابع زیر برای دریافت کمک استفاده کنید:"
text.discordChat="گفتگوی Discord ما احتمالاً سریع‌ترین راه برای دریافت پاسخ هر یک از سوالات شماست. جامعه ما فعال و فوق‌العاده کمک‌رسان است."
text.documentation="مستندات ما به تفصیل درباره نحوه استفاده از Leantime و برخی مفاهیم پشت این قابلیت‌ها توضیح می‌دهد"
text.feature_ideas="برای هر ایده‌ای درباره قابلیت‌های جدید یا باگ‌هایی که ممکن است پیدا کرده باشید، به مخزن Github ما بروید.<br /><br />"
text.support="برای تمام درخواست‌های دیگر لطفاً از طریق فرم تماس با ما در ارتباط باشید. <br /><br /><br />"
