text.these_are_system_wide_settings="این‌ها تنظیمات سراسری سیستمی هستند که بر ظاهر و حس تجربه Leantime شما تأثیر می‌گذارند."
text.company_name_helper="در عنوان صفحه و در ایمیل‌ها نمایش داده می‌شود"
text.advanced_boards_helper_content="ایده‌ها تکامل پیدا می‌کنند، رشد می‌کنند و بالغ می‌شوند. اینجا جایی برای پیگیری آن‌هاست.<br/>کارت‌های ایده را از یک ستون به ستون بعدی ببرید تا وضعیت فعلی آن‌ها را نشان دهید.<br/>این جای خوبی برای شروع پژوهش، توسعه نمونه‌های اولیه و اعتبارسنجی آن‌ها با چند مشتری پیش از شروع پیاده‌سازی است."
text.backlog_helper_content="بک‌لاگ خانه همه تودوهای شماست؛ آن‌هایی که اکنون روی آن‌ها کار می‌کنید و قصد دارید روی آن‌ها کار کنید.<br/><br/>برای پیشرفت در تکمیل بک‌لاگ، کار در دوره‌های کوتاه تکرارشونده - اسپرینت‌ها - را پیشنهاد می‌کنیم.<br/>اسپرینت‌ها بازه‌های زمانی دو هفته‌ای هستند که به شما امکان می‌دهند روی بخش‌های کوچکتر و قابل تحویل کار تمرکز کنید.<br/>در پایان دو هفته باید چیزی برای «دمو» داشته باشید. چیزی که برای کاربران یا مشتریان شما ارزش ایجاد کند.<br/><br/>در این صفحه می‌توانید فهرست تودوهای خود را سازمان‌دهی و مدیریت کنید، با کشیدن و رها کردن به بک‌لاگ خود اولویت دهید و موارد بک‌لاگ را به اسپرینت فعلی خود منتقل کنید.<br/>اطلاعات بیشتر می‌خواهید؟ تور را شروع کنید یا برای شروع کار آن را ببندید!"
text.glad_youre_here="خوشحالیم که اینجا هستید. اجازه دهید یک دقیقه با هم آشنا شویم."
text.business_research_section="بخش پژوهش کسب‌وکار ما، خانه جدید ایده‌های شماست. این بخش برای همراهی شما در مراحل توسعه مشتری، پژوهش مشکل و ایده‌پردازی راه‌حل طراحی شده است."
text.our_roadmap_design="نقشه راه ما برای رساندن شما از نقاط عطف کوچکتر و قابل‌مدیریت به تکمیل تصویر بزرگ طراحی شده است. برای نقاط عطف حدود ۳ ماه برنامه‌ریزی کنید و از این نشانگرهای پروژه برای در مسیر ماندن استفاده کنید."
text.this_is_where_you_spend_most_time="اینجا جایی است که بیشتر زمان خود را صرف می‌کنید - انجام کار. اسپرینت‌های ۲ هفته‌ای خود را برنامه‌ریزی کنید و با تخته کانبان و ابزارهای بک‌لاگ ما با موفقیت آن‌ها را اجرا کنید. از بازاندیشی‌ها برای رشد در اسپرینت بعدی استفاده کنید."
text.idea_board_helper_content="اینجا جایی برای جمع‌آوری همه ایده‌های شماست. درباره ایده‌های جدید با تیم خود بحث کنید و نقاط عطف را متصل کنید تا پیشرفت نسبت به ایده‌های خود را ببینید."
text.kanban_helper_content="کانبان در زبان ژاپنی به معنای «کارت» است. تخته‌های کانبان توسط مهندسان تویوتا در دهه ۴۰ با روش Lean در تولید پایه‌گذاری شدند.<br/>برای به اشتراک‌گذاری سریع اطلاعات و پیشرفت کار به صورت بصری استفاده می‌شود.<br/>تخته‌های کانبان برای مصورسازی کار و وضعیت، کمک به مدیریت کارهای فعال یا در حال انجام، مدیریت جریان کار و واکنش سریع به بهبودهای ناب مفید هستند."
text.my_timesheets_helper_content="تایم‌شیت‌ها جایی برای پیگیری ساعات واقعی کار شده روی یک تودو هستند.<br/>این برای اهداف صورت‌حساب مفید است، اما همچنین برای اعتبارسنجی اینکه چقدر خوب وظایف خود را از پیش برنامه‌ریزی می‌کنید.<br/>به مرور زمان Leantime می‌تواند تاریخ‌های سررسید را برای جبران مغایرت‌های برنامه‌ریزی تنظیم کند."
text.new_project_helper_content="<p>اینجا جایی است که پروژه خود را توصیف، تعریف و پارامترهای آن را تنظیم می‌کنید. این مهم است زیرا بخشی است که اولویت‌ها، انتظارات و دستورالعمل‌های پروژه را به کل تیم منتقل می‌کند.</p><p><br/><em>نکاتی که باید اینجا در نظر بگیرید: ۴ C.<br>واضح، مختصر، کامل و قابل‌اعتماد باشید.<br/><br/></em></p><p>تسلط بر این موارد در توضیحات پروژه، همه را در یک صفحه نگه می‌دارد و خطر خطا یا اشتباه را به حداقل می‌رساند.</p><br/>زمان شروع است!<br/><br/>"
text.not_found_helper_content="<p>ما هنوز برای این صفحه محتوایی نداریم.<br/>لطفاً از لینک «راهنمی لازم دارم» در پایین صفحه استفاده کنید تا درباره کارهایی که می‌توانید اینجا انجام دهید بیشتر بدانید.</p>"
text.retros_helper_content="<p>بازاندیشی‌ها، تأملات کوتاهی درباره کار، عملکرد تیم و البته پیشرفت هستند.<br/>اینجا جایی است که تیم شما می‌تواند برای بررسی آنچه خوب پیش رفت، آنچه خوب پیش نرفت و آنچه دفعه بعد می‌توان متفاوت انجام داد، کمی مکث کند.<br/>پیشنهاد می‌کنیم جلسات بازبینی را در بازه‌های منظم، یا حداقل در پایان هر نقطه عطف برگزار کنید.<br/></p>"
text.roadmap_helper_content="<p>نقشه‌های راه برای تقسیم پروژه‌های بزرگ به بخش‌های کوچکتر و قابل‌مدیریت مفید هستند.<br/><br/></p><p>برای ایجاد نقشه راه خود، پیشنهاد می‌کنیم نقاط عطفی را تعیین کنید که در بازه ۳ ماهه قابل دستیابی باشند.</p><p>نقاط عطف، ایستگاه‌های بازرسی در مسیر تکمیل پروژه هستند.<br/>ساده بگوییم: اگر یک سفر جاده‌ای سراسری دارید، هر ایالتی که از آن عبور می‌کنید می‌تواند یک نقطه عطف باشد.<br/><br/>روی «افزودن نقطه عطف» در سمت بالا و چپ کلیک کنید تا شروع کنید. تاریخ را در این تب یا در خود نمودار نقشه راه با کلیک و کشیدن نقطه عطف در تقویم تنظیم کنید.</p>"
text.show_clients_helper_content="<p>مشتریان/محصولات، پروژه‌های شما را در دسته‌بندی‌ها سازمان‌دهی می‌کنند و به شما امکان می‌دهند گروه‌های مختلف را جدا کنید.<br/><br/></p><p>به عنوان یک مشاور، از قبل با مشتریان کار می‌کنید و این جایی برای سازمان‌دهی آن‌هاست.</p><p>اگر یک تیم محصول هستید، می‌توانید از این بخش برای سازمان‌دهی و جدا کردن واحدهای خود (بازاریابی، فروش، عملیات و غیره) استفاده کنید.</p>"
text.show_projects_helper_content="<p>پروژه‌ها قلب کسب‌وکار شما و Leantime هستند! تغییر، توسعه، اهداف و هر چیزی که می‌توانید بسازید یا تصور کنید، شامل پروژه‌ها می‌شود.<br/>مدیریت پروژه صرفاً فرایند اطمینان از تحویل به‌موقع، درست و با ارزش واقعی کسب‌وکار بودن پروژه‌های شماست.<br/><br/>پروژه‌های شما اینجا زندگی می‌کنند. صفحه پروژه‌های شما امکان ایجاد یک پروژه، دیدن سریع تعداد تودوها، ساعات، بودجه و مشتری مرتبط با پروژه را فراهم می‌کند.<br/><br/>از این صفحه برای یک نمای کلی از همه پروژه‌های خود استفاده کنید.<br/><br/></p>"
text.new_db_version="یک نسخه جدید نصب شده است. برای استفاده از Leantime باید پایگاه داده خود را به‌روزرسانی کنید.<br/><br/><strong>لطفاً پیش از انجام این به‌روزرسانی حتماً از پایگاه داده خود نسخه پشتیبان تهیه کنید!</strong><br/>این کار ممکن است چند دقیقه طول بکشد."
text.update_was_successful="به‌روزرسانی با موفقیت انجام شد، اکنون می‌توانید وارد شوید. <a href='%1$s'>به ورود بروید</a>"
text.this_script_will_set_up_leantime="این اسکریپت پایگاه داده شما را تنظیم و یک حساب مدیر ایجاد می‌کند"
text.enter_new_password="رمز عبور جدید خود را برای بازنشانی آن وارد کنید."
text.enter_email_address_to_reset="آدرس ایمیل خود را برای بازنشانی رمز عبور وارد کنید."
text.twoFA_qr="کد QR زیر را در برنامه OTP دلخواه خود یا Google Authenticator اسکن کنید"
text.twoFA_verify_code="کدی که برنامه OTP یا Google Authenticator به شما می‌دهد را وارد کنید"
text.twoFA_already_enabled="احراز هویت دو مرحله‌ای از قبل برای حساب شما فعال است و برای ورود لازم است.<br/><br/>برای حذف احراز هویت دو مرحله‌ای، روی حذف در پایین کلیک کنید"
text.twoFA_enabled="حساب شما احراز هویت دو مرحله‌ای را <strong>فعال</strong> دارد."
text.twoFA_disabled="حساب شما احراز هویت دو مرحله‌ای را <strong>غیرفعال</strong> دارد."
text.twoFA_manage="<span class='fa fa-lock'></span> مدیریت احراز هویت دو مرحله‌ای"
text.who_can_access="انتخاب کنید چه کسی مجاز به مشاهده این پروژه باشد. به طور پیش‌فرض، کاربران نقش‌هایی که برایشان تنظیم شده به ارث می‌برند. می‌توانید این نقش‌ها را در تب «تیم» تغییر دهید"
text.ical_export_description="اینجا می‌توانید یک آدرس تقویم یکتا ایجاد کنید که به شما امکان می‌دهد تقویم Leantime خود را در هر برنامه‌ای که از قالب «iCal» پشتیبانی می‌کند، ادغام کنید. "
text.you_ical_url="آدرس تقویم شما در زیر آمده است. <br /> لطفاً توجه داشته باشید که هر کسی با این آدرس می‌تواند به تقویم دسترسی داشته باشد. آن را مانند رمز عبور محرمانه نگه دارید."
text.no_url="با کلیک روی دکمه زیر یک آدرس تولید کنید"
text.no_canvas="این پروژه هنوز هیچ تخته‌ای ندارد."
text.no_login_form="لطفاً با یکی از روش‌های زیر وارد شوید."
text.new_plugins="افزونه‌های بارگیری شده"
