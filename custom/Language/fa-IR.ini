text.welcome_to_leantime_2="سلام! 👋 <br />از دیدن شما خوشحالیم! فقط کمی اطلاعات دیگر نیاز داریم تا حساب کاربری شما را برایتان آماده کنیم."
text.things_get_organized="کارها قرار است منظم‌تر شوند!"
text.project_hub_intro="این مرکز پروژه‌های شماست. تمام پروژه‌هایی که در حال حاضر به شما اختصاص داده شده یا محبوب کرده‌اید اینجا هستند."
text.no_favorites="شما هیچ محبوبی ندارید. 😿"
text.all_assigned_projects="🗂️ تمام پروژه‌های اختصاص‌یافته"
text.get_organized_with_projects="از اینکه شما را راهنمایی کنیم و کارهایتان را منظم کنیم هیجان‌زده‌ایم.<br /><br />Leantime کارهای شما را در قالب «پروژه» مدیریت می‌کند. ساده‌ترین راه برای تعریف پروژه این است که به چیزی <strong>که می‌خواهید به آن دست یابید</strong> فکر کنید. این می‌تواند شامل معیارهایی که می‌خواهید به آن‌ها برسید، یک پروژه مشتری یا چیزی باشد که می‌خواهید بسازید. سپس پروژه‌ها به اهداف با معیارها و نقاط عطف تقسیم می‌شوند. <br /><br />"
label.start_with_project_title="بیایید با یک عنوان برای پروژه‌ایمان شروع کنیم"
headlines.make_it_happen="آن را به سرانجام برسانید"
text.structured_project_thinking="دست یافتن به اهداف و متمرکز ماندن نیازمند تعریف یک پایه برای پروژه شماست. خیلی اوقات ما بدون اینکه زیر سؤال ببریم آیا این اولویت‌ها واقعاً تفاوتی ایجاد می‌کنند، صرفاً جدیدترین اولویت‌ها را روی کاغذ می‌ریزیم. بیایید چند پرسش ساده از خودمان بپرسیم تا درک بهتری از آنچه به سوی آن حرکت می‌کنیم داشته باشیم."
