text.ea.helper_content="<em>تحلیل محیطی</em>، که با نام <em>تحلیل PESTLE</em> نیز شناخته می‌شود، به شما کمک می‌کند محیط فعلی و/یا آینده‌ای که در آن فعالیت می‌کنید را در شش بُعد ارزیابی کنید: سیاسی، اقتصادی، اجتماعی، فناورانه، حقوقی و بوم‌شناختی.<br/>پیشنهاد می‌کنیم یک تحلیل محیطی را در ابتدای پروژه خود، حداقل قبل از شروع مرحله ایده‌پردازی انجام دهید و آن را در طول پروژه به‌روز نگه دارید."
