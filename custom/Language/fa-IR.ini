text.insights.helper_content="تابلوی <em>مشاهده / یادگیری - بینش‌ها</em> به شما کمک می‌کند بینش‌ها را از چهار منبع مختلف (مشاهدات قوم‌نگارانه، مصاحبه‌ها، گروه‌های کانونی و تحقیقات ثانویه) جمع‌آوری و ساختاردهی کرده و آن‌ها را به دانش تبدیل کنید.<br/>این تابلو از مراحل مشاهده و یادگیری، که گاهی همدلی و تعریف نامیده می‌شوند، در فرآیند تفکر طراحی پشتیبانی می‌کند.<br/>پیشنهاد می‌کنیم هر بار که بینش‌های جدیدی جمع‌آوری و تحلیل می‌کنید، از تابلو <em>مشاهده / یادگیری - بینش‌ها</em> استفاده کنید، چه برای تحلیل ریسک، تحلیل محیطی، کشف روندهای صنعتی، یا برای طراحی محصولات و خدمات جدید، که فقط چند نمونه بودند."
