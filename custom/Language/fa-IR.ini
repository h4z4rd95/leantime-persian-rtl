text.full_lean_canvas_helper_content="تخته پژوهش کامل، شما را در کل فرایند اعتبارسنجی ایده راهنمایی می‌کند.<br/>در این صفحه، یک‌بار دیگر به بخش مشتریان، مشکل و راه‌حل خود می‌پردازید (اما نگران نباشید، اگر این موارد را از قبل در تخته ساده پر کرده‌اید، آن‌ها را اینجا دوباره خواهید دید!).<br/>از آنجا به ارزش پیشنهادی روشن (چه چیزی ایده شما را از سایر گزینه‌ها بهتر می‌کند؟)،<br/>کانال‌های فروش (مشتریان چگونه راه‌حل شما را به دست می‌آورند؟)<br/>جریان‌های درآمدی (راه‌حل شما چگونه درآمد کسب می‌کند؟)<br/>ساختار هزینه (راه‌حل شما چقدر می‌ارزد؟) معیارهای کلیدی (موفقیت را چگونه اندازه می‌گیرید؟)<br/>و مزیت رقابتی نابرابر (چه چیزی شما را در برابر رقبا متمایز می‌کند؟) می‌پردازید.<br/>پاسخ به این پرسش‌ها برای ایجاد موفقیت، کاهش شکست‌ها، و پیگیری و اعتبارسنجی فرضیات شما طراحی شده است.<br/>روش Lean درباره حذف اتلاف و ساختن محصول‌ها، فروشگاه‌ها و راه‌حل‌هایی است که مشتریان شما به آن‌ها نیاز دارند."
