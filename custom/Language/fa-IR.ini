text.lean.helper_content="بوم ناب شما را در فرایند کامل اعتبارسنجی ایده کسب‌وکار و/یا محصول جدیدتان همراهی می‌کند.<br/>شما به <em>بخش مشتری</em> و <em>مشکل و راه‌حل</em> می‌پردازید.<br/>سوّم به سراغ <em>ارزش پیشنهادی یکتا</em> (چه چیزی ایده شما را بهتر از سایر گزینه‌ها می‌کند؟)، <em>کانال‌های توزیع</em> (راه‌حل خود را چگونه به دست مشتریان می‌رسانید؟)، <em>جریان‌های درآمدی</em> (راه‌حل شما چگونه درآمدزایی می‌کند؟)، <em>ساختار هزینه‌ها</em> (راه‌حل شما چه ارزشی دارد؟)، <em>معیارهای کلیدی</em> (موفّقیت را چگونه می‌سنجید؟) و <em>مزیت غیرقابل‌تقلید</em> (چه چیزی دارید که به شما در پیروزی بر رقبا کمک می‌کند؟) می‌روید.<br/>پاسخ به این پرسش‌ها برای ترویج موفّقیت، کاهش خطر شکست و امکان ردیابی و اعتبارسنجی فرضیات شما طراحی شده است. ناب بودن یعنی حذف اتلاف و تلاش برای ساختن محصول‌ها، کسب‌وکارها و راه‌حل‌هایی که مشتریانتان به آن‌ها نیاز دارند."
text.lean.disclaimer="بوم ناب برگرفته از <a href='https://strategyzer.com/' target='_blank'>Business Model Canvas</a> و تحت مجوز <a href='https://creativecommons.org/licenses/by-sa/3.0/'>Creative Commons Attribution-Share Alike 3.0</a> منتشر شده است"
